
services:
  db:
    image: postgres:16
    container_name: notify_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notify_db}
      POSTGRES_USER: ${POSTGRES_USER:-notify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-notify_user} -d ${POSTGRES_DB:-notify_db}
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: notify_bot
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-notify_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-notify_db}

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
